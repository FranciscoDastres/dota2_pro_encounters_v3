name: stomptracker

x-logging: &default-logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "3"

services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    mem_limit: 384m
    environment:
      POSTGRES_DB: stomptracker
      POSTGRES_USER: stomptracker
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD}
    command:
      - postgres
      - -c
      - max_connections=20
      - -c
      - shared_buffers=128MB
      - -c
      - effective_cache_size=512MB
      - -c
      - work_mem=4MB
      - -c
      - maintenance_work_mem=64MB
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./database/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U stomptracker -d stomptracker"]
      interval: 10s
      timeout: 5s
      retries: 5
    logging: *default-logging

  backend:
    image: ${BACKEND_IMAGE:-ghcr.io/franciscodastres/dota2-pro-encounters-backend:main}
    restart: unless-stopped
    mem_limit: 320m
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      NODE_ENV: production
      NODE_OPTIONS: --max-old-space-size=256
      PORT: "3000"
      FRONTEND_URL: ${FRONTEND_URL:-https://stomptracker.duckdns.org}
      DATABASE_URL: ${DATABASE_URL:?set DATABASE_URL}
      DATABASE_POOL_MAX: ${DATABASE_POOL_MAX:-5}
      OPENDOTA_API_URL: ${OPENDOTA_API_URL:-https://api.opendota.com/api}
      OPENDOTA_API_KEY: ${OPENDOTA_API_KEY:-}
    healthcheck:
      test: ["CMD-SHELL", "node -e \"fetch('http://127.0.0.1:3000/api/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))\""]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 15s
    logging: *default-logging

  web:
    image: ${WEB_IMAGE:-ghcr.io/franciscodastres/dota2-pro-encounters-web:main}
    restart: unless-stopped
    mem_limit: 160m
    depends_on:
      backend:
        condition: service_healthy
    environment:
      SITE_DOMAIN: ${SITE_DOMAIN:-stomptracker.duckdns.org}
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - caddy_data:/data
      - caddy_config:/config
    logging: *default-logging

volumes:
  postgres_data:
  caddy_data:
  caddy_config:
