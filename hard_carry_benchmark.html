<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Hard Carry Benchmark</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.3/dist/chart.umd.min.js"></script>
  <style>
    :root {
      --bg: #0f0f12;
      --card: #1a1b23;
      --card-2: #171820;
      --border: #2a2b37;
      --text: #f4f7fb;
      --muted: #95a0b5;
      --cyan: #39d0ff;
      --cyan-soft: rgba(57, 208, 255, 0.14);
      --green: #4ee8a0;
      --red: #ff5f7a;
      --amber: #ffc85b;
      --shadow: 0 18px 56px rgba(0, 0, 0, 0.4);
    }

    * { box-sizing: border-box; }
    html, body {
      margin: 0;
      background: radial-gradient(circle at top, rgba(57,208,255,0.08), transparent 40%), var(--bg);
      color: var(--text);
      font-family: 'Inter', sans-serif;
    }

    body {
      padding: 24px;
    }

    .hc-shell {
      max-width: 1360px;
      margin: 0 auto;
    }

    .hc-panel {
      border: 1px solid var(--border);
      border-radius: 18px;
      background: linear-gradient(180deg, rgba(255,255,255,0.015), transparent 14%), var(--card);
      box-shadow: var(--shadow);
      overflow: hidden;
    }

    .hc-panel-header {
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      justify-content: space-between;
      gap: 16px;
      padding: 20px 22px;
      border-bottom: 1px solid var(--border);
      background: linear-gradient(180deg, rgba(255,255,255,0.03), rgba(255,255,255,0.01));
    }

    .hc-title {
      display: flex;
      align-items: center;
      gap: 14px;
      min-width: 0;
    }

    .hc-hero-portrait {
      width: 64px;
      height: 64px;
      border-radius: 16px;
      border: 1px solid rgba(57,208,255,0.32);
      background: #0d1018;
      padding: 3px;
      object-fit: cover;
      box-shadow: 0 0 24px rgba(57,208,255,0.12);
      flex: 0 0 auto;
    }

    .hc-title-text {
      min-width: 0;
    }

    .hc-kicker {
      color: var(--cyan);
      text-transform: uppercase;
      letter-spacing: 0.2em;
      font-size: 11px;
      font-weight: 700;
      margin-bottom: 6px;
    }

    .hc-hero-name {
      margin: 0;
      font-size: 26px;
      line-height: 1.05;
      font-weight: 800;
      letter-spacing: -0.03em;
    }

    .hc-sub {
      margin: 6px 0 0;
      color: var(--muted);
      font-size: 13px;
    }

    .hc-score {
      width: 108px;
      height: 108px;
      border-radius: 50%;
      position: relative;
      display: grid;
      place-items: center;
      background: conic-gradient(var(--cyan) 0 0, rgba(255,255,255,0.08) 0);
      padding: 7px;
      flex: 0 0 auto;
    }

    .hc-score::before {
      content: "";
      position: absolute;
      inset: 7px;
      border-radius: 50%;
      background: #12141c;
      border: 1px solid rgba(255,255,255,0.06);
    }

    .hc-score-inner {
      position: relative;
      z-index: 1;
      width: 100%;
      height: 100%;
      border-radius: 50%;
      display: grid;
      place-items: center;
      text-align: center;
    }

    .hc-score-value {
      font-size: 28px;
      font-weight: 800;
      line-height: 1;
      letter-spacing: -0.04em;
    }

    .hc-score-label {
      font-size: 10px;
      text-transform: uppercase;
      letter-spacing: 0.18em;
      color: var(--muted);
      margin-top: 4px;
    }

    .hc-body {
      display: grid;
      grid-template-columns: 1.1fr 0.9fr;
      gap: 18px;
      padding: 18px;
    }

    .hc-card {
      border: 1px solid var(--border);
      border-radius: 16px;
      background: var(--card-2);
      overflow: hidden;
    }

    .hc-card-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      padding: 14px 16px;
      border-bottom: 1px solid var(--border);
    }

    .hc-card-title {
      margin: 0;
      font-size: 12px;
      text-transform: uppercase;
      letter-spacing: 0.18em;
      color: #7ecfff;
      font-weight: 700;
    }

    .hc-card-subtitle {
      margin: 3px 0 0;
      color: var(--muted);
      font-size: 12px;
    }

    .hc-grid {
      display: grid;
      gap: 18px;
    }

    .hc-stats {
      grid-template-columns: repeat(2, minmax(0, 1fr));
    }

    .hc-stat {
      border: 1px solid rgba(255,255,255,0.06);
      border-radius: 14px;
      background: rgba(255,255,255,0.02);
      padding: 14px;
      min-height: 92px;
    }

    .hc-stat-top {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 10px;
      margin-bottom: 10px;
    }

    .hc-stat-label {
      font-size: 11px;
      text-transform: uppercase;
      letter-spacing: 0.14em;
      color: var(--muted);
      font-weight: 700;
    }

    .hc-stat-badge {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      padding: 6px 10px;
      border-radius: 999px;
      font-size: 11px;
      font-weight: 700;
      border: 1px solid rgba(255,255,255,0.08);
    }

    .hc-stat-value {
      font-size: 24px;
      font-weight: 800;
      letter-spacing: -0.04em;
      margin: 0;
    }

    .hc-stat-delta {
      font-size: 12px;
      color: var(--muted);
      margin-top: 6px;
    }

    .hc-up { color: var(--green); }
    .hc-down { color: var(--red); }
    .hc-mid { color: var(--amber); }

    .hc-mini-chart {
      height: 240px;
      padding: 14px 16px 16px;
    }

    .hc-section {
      padding: 16px;
      border-top: 1px solid var(--border);
    }

    .hc-ability-seq,
    .hc-talent-grid,
    .hc-neutral-grid,
    .hc-item-grid {
      display: grid;
      gap: 10px;
    }

    .hc-ability-seq {
      grid-template-columns: repeat(auto-fit, minmax(72px, 1fr));
    }

    .hc-bubble {
      border: 1px solid rgba(255,255,255,0.08);
      background: rgba(255,255,255,0.03);
      border-radius: 14px;
      padding: 10px;
      min-height: 92px;
    }

    .hc-bubble-head {
      display: flex;
      align-items: center;
      gap: 10px;
      margin-bottom: 8px;
    }

    .hc-icon {
      width: 34px;
      height: 34px;
      border-radius: 10px;
      border: 1px solid rgba(255,255,255,0.08);
      object-fit: cover;
      background: #10131b;
      flex: 0 0 auto;
    }

    .hc-bubble-title {
      font-size: 13px;
      font-weight: 700;
      margin: 0;
    }

    .hc-bubble-meta {
      color: var(--muted);
      font-size: 11px;
      margin: 0;
    }

    .hc-ability-badge {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      width: 100%;
      min-height: 26px;
      border-radius: 999px;
      background: rgba(57,208,255,0.08);
      color: #bdefff;
      font-size: 12px;
      font-weight: 800;
      letter-spacing: 0.08em;
    }

    .hc-talent-grid {
      grid-template-columns: repeat(2, minmax(0, 1fr));
    }

    .hc-talent-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      border: 1px solid rgba(255,255,255,0.06);
      border-radius: 14px;
      padding: 10px 12px;
      background: rgba(255,255,255,0.025);
    }

    .hc-pill {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      padding: 6px 10px;
      border-radius: 999px;
      font-size: 11px;
      font-weight: 700;
      border: 1px solid rgba(255,255,255,0.08);
    }

    .hc-neutral-grid {
      grid-template-columns: repeat(auto-fit, minmax(170px, 1fr));
    }

    .hc-item-grid {
      grid-template-columns: repeat(auto-fit, minmax(210px, 1fr));
    }

    .hc-item-row {
      display: flex;
      flex-direction: column;
      gap: 10px;
      border: 1px solid rgba(255,255,255,0.06);
      border-radius: 14px;
      padding: 12px;
      background: rgba(255,255,255,0.025);
    }

    .hc-item-top {
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .hc-item-line {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
      font-size: 12px;
      color: var(--muted);
    }

    .hc-bar {
      height: 10px;
      border-radius: 999px;
      overflow: hidden;
      background: rgba(255,255,255,0.06);
      position: relative;
    }

    .hc-bar > span {
      display: block;
      height: 100%;
      border-radius: inherit;
      background: linear-gradient(90deg, var(--cyan), #7ef1ff);
    }

    .hc-full {
      grid-column: 1 / -1;
    }

    .hc-note {
      color: var(--muted);
      font-size: 12px;
      line-height: 1.5;
    }

    @media (max-width: 1080px) {
      .hc-body {
        grid-template-columns: 1fr;
      }
    }

    @media (max-width: 720px) {
      body { padding: 14px; }
      .hc-panel-header { padding: 16px; }
      .hc-body { padding: 14px; }
      .hc-grid, .hc-stats, .hc-talent-grid { grid-template-columns: 1fr; }
      .hc-hero-name { font-size: 22px; }
      .hc-score { width: 94px; height: 94px; }
    }
  </style>
</head>
<body>
  <div class="hc-shell">
    <div id="hc-benchmark-root" class="hc-panel"></div>
  </div>

  <script>
    (() => {
      const HERO_CDN = 'https://cdn.cloudflare.steamstatic.com/apps/dota2/images/dota_react/heroes/';
      const ABILITY_CDN = 'https://cdn.cloudflare.steamstatic.com/apps/dota2/images/dota_react/abilities/';
      const ITEM_CDN = 'https://cdn.cloudflare.steamstatic.com/apps/dota2/images/dota_react/items/';

      const HERO_SLUG_BY_ID = {
        1: 'antimage',
        2: 'axe',
        3: 'bane',
        4: 'bloodseeker',
        5: 'crystal_maiden',
        6: 'drow_ranger',
        7: 'earthshaker',
        8: 'juggernaut',
        9: 'mirana',
        10: 'morphling',
        11: 'shadow_fiend',
        12: 'phantom_lancer',
        13: 'puck',
        14: 'pudge',
        15: 'razor',
        16: 'sand_king',
        17: 'storm_spirit',
        18: 'sven',
        19: 'tiny',
        20: 'vengefulspirit',
        21: 'windranger',
        22: 'zeus',
        23: 'kunkka',
        25: 'lina',
        31: 'faceless_void',
        44: 'phantom_assassin',
        48: 'luna',
        52: 'leshrac',
        54: 'life_stealer',
        56: 'viper',
        59: 'medusa',
        60: 'sniper',
        61: 'necrolyte',
        62: 'warlock',
        68: 'ancient_apparition',
        69: 'doom_bringer',
        72: 'gyrocopter',
        74: 'alchemist',
        87: 'disruptor',
        89: 'naga_siren',
        91: 'meepo',
        96: 'terrorblade',
        97: 'mars',
        102: 'abaddon',
        106: 'legion_commander',
        108: 'underlord',
        109: 'terrorblade',
        110: 'phoenix',
        121: 'gruntle',
        123: 'hoodwink',
        126: 'void_spirit',
        129: 'mars',
        135: 'dawnbreaker',
        137: 'marci',
        138: 'muerta'
      };

      const DEFAULT_TALENT_ICONS = {
        10: 'aghanims_scepter',
        15: 'moon_shard',
        20: 'ultimate_scepter',
        25: 'arcane_blink'
      };

      const root = document.getElementById('hc-benchmark-root');
      let chart = null;

      const defaultPlayer = {
        heroName: 'phantom_assassin',
        heroDisplayName: 'Phantom Assassin',
        gpm: 560,
        xpm: 580,
        lh10: 58,
        netWorth: 21450,
        kills: 14,
        deaths: 3,
        assists: 8,
        abilityUpgrades: ['Q', 'E', 'Q', 'W', 'Q', 'R', 'E', 'Q', 'E', 'W', 'R', 'W'],
        talentChoices: {
          10: 'left',
          15: 'right',
          20: 'left',
          25: 'right'
        },
        neutralItems: {
          tier1: { item: 'broom_handle', time: '07:30' },
          tier2: { item: 'iron_talon', time: '15:20' },
          tier3: { item: 'dandelion_amulet', time: '23:40' },
          tier4: { item: 'paladin_sword', time: '31:10' },
          tier5: { item: 'apex', time: '39:45' }
        },
        itemTimings: {
          power_treads: 7.25,
          battle_fury: 14.23,
          black_king_bar: 23.08,
          abyssal_blade: 31.5
        }
      };

      const defaultBenchmark = {
        hcScore: 92,
        gpm: 720,
        xpm: 790,
        lh10: 75,
        netWorth: 25200,
        kills: 16,
        deaths: 2,
        assists: 9,
        abilityUpgrades: ['Q', 'W', 'Q', 'E', 'Q', 'R', 'Q', 'W', 'E', 'E', 'R', 'W'],
        talentChoices: {
          10: 'right',
          15: 'right',
          20: 'left',
          25: 'left'
        },
        neutralItems: {
          tier1: { item: 'broom_handle', time: '06:50' },
          tier2: { item: 'specialists_array', time: '14:30' },
          tier3: { item: 'dandelion_amulet', time: '22:10' },
          tier4: { item: 'paladin_sword', time: '30:20' },
          tier5: { item: 'mirror_shield', time: '38:00' }
        },
        itemTimings: {
          power_treads: 6.4,
          battle_fury: 12,
          black_king_bar: 20.6,
          abyssal_blade: 29.4
        }
      };

      const heroInfo = {
        name: 'phantom_assassin',
        displayName: 'Phantom Assassin'
      };

      function formatTime(minutes) {
        if (minutes == null || Number.isNaN(minutes)) return '--:--';
        const total = Math.round(minutes * 60);
        const mm = Math.floor(total / 60);
        const ss = String(total % 60).padStart(2, '0');
        return `${mm}:${ss}`;
      }

      function formatNumber(value) {
        return Number(value).toLocaleString();
      }

      function clamp(value, min, max) {
        return Math.min(max, Math.max(min, value));
      }

      function heroPortrait(name) {
        return `${HERO_CDN}${name}.png`;
      }

      function abilityIcon(name) {
        return `${ABILITY_CDN}${name}.png`;
      }

      function itemIcon(name) {
        return `${ITEM_CDN}${name}.png`;
      }

      function buildStatDelta(value, optimal, displayName, decimals = 1) {
        const diff = value - optimal;
        const trend = diff === 0 ? 'mid' : (diff > 0 ? 'up' : 'down');
        return { label: displayName, value, optimal, diff, trend, decimals };
      }

      function resolveHeroSlug(playerData = {}, heroData = {}) {
        if (heroData && heroData.name) return heroData.name;
        if (playerData && playerData.heroName) return playerData.heroName;
        if (playerData && playerData.hero_id && HERO_SLUG_BY_ID[playerData.hero_id]) {
          return HERO_SLUG_BY_ID[playerData.hero_id];
        }
        return 'phantom_assassin';
      }

      function normalizeAbilitySequence(sequence = []) {
        return sequence.map((entry) => {
          if (typeof entry === 'string') {
            return { code: entry, slug: skillIconKey(entry) };
          }

          if (typeof entry === 'number') {
            return { code: `#${entry}`, slug: 'generic' };
          }

          if (entry && typeof entry === 'object') {
            const code = entry.code || entry.ability || entry.slot || 'Q';
            const slug = entry.slug || entry.name || skillIconKey(code);
            return { code, slug };
          }

          return { code: 'Q', slug: skillIconKey('Q') };
        });
      }

      function normalizeTalentChoices(choices = {}) {
        return [10, 15, 20, 25].reduce((acc, tier) => {
          const value = choices[tier] ?? choices[String(tier)] ?? 'left';
          acc[tier] = value;
          return acc;
        }, {});
      }

      function normalizeNeutralItems(items = {}) {
        return ['tier1', 'tier2', 'tier3', 'tier4', 'tier5'].reduce((acc, tier) => {
          const value = items[tier] || items[tier.toUpperCase()] || null;
          acc[tier] = value
            ? (typeof value === 'string'
              ? { item: value, time: '--:--' }
              : {
                  item: value.item || value.name || 'unknown_item',
                  time: value.time || value.at || '--:--'
                })
            : { item: 'unknown_item', time: '--:--' };
          return acc;
        }, {});
      }

      function normalizeItemTimings(items = {}) {
        return Object.entries(items).reduce((acc, [key, value]) => {
          if (typeof value === 'number') {
            acc[key] = value;
            return acc;
          }
          if (value && typeof value === 'object') {
            const time = value.time ?? value.minutes ?? value.minute ?? null;
            if (time != null) acc[key] = Number(time);
          }
          return acc;
        }, {});
      }

      function skillIconKey(code) {
        const map = {
          Q: 'phantom_assassin_stifling_dagger',
          W: 'phantom_assassin_phantom_strike',
          E: 'phantom_assassin_blink_strike',
          R: 'phantom_assassin_coup_de_grace'
        };
        return map[code] || 'generic';
      }

      function talentLabel(level, choice) {
        return `${level} - ${choice === 'left' ? 'Left' : 'Right'}`;
      }

      function neutralTitle(item) {
        return item.replaceAll('_', ' ');
      }

      function skillSeqMarkup(seq) {
        return seq.map((entry, idx) => `
          <div class="hc-bubble">
            <div class="hc-bubble-head">
              <img class="hc-icon" src="${abilityIcon(entry.slug)}" alt="${entry.code}" />
              <div>
                <p class="hc-bubble-title">${entry.code}</p>
                <p class="hc-bubble-meta">Level ${idx + 1}</p>
              </div>
            </div>
            <div class="hc-ability-badge">${entry.code}</div>
          </div>
        `).join('');
      }

      function talentMarkup(player, benchmark) {
        const tiers = [10, 15, 20, 25];
        return tiers.map((tier) => {
          const chosen = player.talentChoices[tier];
          const bench = benchmark.talentChoices[tier];
          const better = chosen === bench;
          return `
            <div class="hc-talent-row">
              <div class="hc-title-text" style="min-width:0">
                <p class="hc-bubble-title" style="margin:0">${tier}</p>
                <p class="hc-bubble-meta" style="margin:4px 0 0">You: ${chosen} | Pro: ${bench}</p>
              </div>
              <span class="hc-pill" style="color:${better ? 'var(--green)' : 'var(--amber)'}; background:${better ? 'rgba(78,232,160,0.08)' : 'rgba(255,200,91,0.08)'}">
                ${better ? 'Match' : 'Diff'}
              </span>
            </div>
          `;
        }).join('');
      }

      function neutralMarkup(player, benchmark) {
        const tiers = ['tier1', 'tier2', 'tier3', 'tier4', 'tier5'];
        return tiers.map((tier) => {
          const p = player.neutralItems[tier] || { item: 'unknown_item', time: '--:--' };
          const b = benchmark.neutralItems[tier] || { item: 'unknown_item', time: '--:--' };
          return `
            <div class="hc-bubble">
              <div class="hc-bubble-head">
                <img class="hc-icon" src="${itemIcon(p.item)}" alt="${p.item}" />
                <div>
                  <p class="hc-bubble-title">${tier.toUpperCase()}</p>
                  <p class="hc-bubble-meta">${p.time} | benchmark ${b.time}</p>
                </div>
              </div>
              <div class="hc-note">${neutralTitle(p.item)} vs ${neutralTitle(b.item)}</div>
            </div>
          `;
        }).join('');
      }

      function itemTimingMarkup(player, benchmark) {
        const items = ['power_treads', 'battle_fury', 'black_king_bar', 'abyssal_blade'];
        return items.map((item) => {
          const playerTime = player.itemTimings[item] ?? null;
          const benchTime = benchmark.itemTimings[item] ?? null;
          const ratio = playerTime && benchTime ? (benchTime / Math.max(playerTime, 0.1)) * 100 : 24;
          const diff = playerTime - benchTime;
          const width = clamp(ratio, 20, 100);
          return `
            <div class="hc-item-row">
              <div class="hc-item-top">
                <img class="hc-icon" src="${itemIcon(item)}" alt="${item}" />
                <div style="min-width:0">
                  <div class="hc-bubble-title">${item.replaceAll('_', ' ')}</div>
                  <div class="hc-bubble-meta">${formatTime(playerTime)} vs ${formatTime(benchTime)}</div>
                </div>
              </div>
              <div class="hc-bar" aria-hidden="true"><span style="width:${width}%"></span></div>
              <div class="hc-item-line">
                <span>${diff <= 0 ? 'Ahead' : 'Behind'}</span>
                <span class="${diff <= 0 ? 'hc-up' : 'hc-down'}">${diff > 0 ? '+' : ''}${Number(diff || 0).toFixed(1)}m</span>
              </div>
            </div>
          `;
        }).join('');
      }

      function normalizePlayerData(player = {}) {
        return {
          heroName: player.heroName || player.hero_name || player.hero || player.heroSlug,
          hero_id: player.hero_id,
          heroDisplayName: player.heroDisplayName || player.localized_name || player.displayName || player.hero_name || 'Hard Carry',
          gpm: Number(player.gpm ?? player.gold_per_min ?? 0),
          xpm: Number(player.xpm ?? player.xp_per_min ?? 0),
          lh10: Number(player.lh10 ?? player.last_hits_10min ?? player.last_hits ?? 0),
          netWorth: Number(player.netWorth ?? player.net_worth ?? player.net_worth_total ?? 0),
          kills: Number(player.kills ?? 0),
          deaths: Number(player.deaths ?? 0),
          assists: Number(player.assists ?? 0),
          abilityUpgrades: player.abilityUpgrades || player.ability_upgrades_arr || player.ability_upgrades || [],
          talentChoices: player.talentChoices || player.talents || player.talent_choices || {},
          neutralItems: player.neutralItems || player.neutral_items || {},
          itemTimings: player.itemTimings || player.item_timings || {}
        };
      }

      function normalizeBenchmarkData(benchmark = {}) {
        return {
          hcScore: Number(benchmark.hcScore ?? benchmark.hc_score ?? 90),
          gpm: Number(benchmark.gpm ?? benchmark.gold_per_min ?? 700),
          xpm: Number(benchmark.xpm ?? benchmark.xp_per_min ?? 760),
          lh10: Number(benchmark.lh10 ?? benchmark.last_hits_10min ?? benchmark.last_hits ?? 70),
          netWorth: Number(benchmark.netWorth ?? benchmark.net_worth ?? 24000),
          kills: Number(benchmark.kills ?? 0),
          deaths: Number(benchmark.deaths ?? 1),
          assists: Number(benchmark.assists ?? 0),
          abilityUpgrades: benchmark.abilityUpgrades || benchmark.ability_upgrades_arr || benchmark.ability_upgrades || [],
          talentChoices: benchmark.talentChoices || benchmark.talents || benchmark.talent_choices || {},
          neutralItems: benchmark.neutralItems || benchmark.neutral_items || {},
          itemTimings: benchmark.itemTimings || benchmark.item_timings || {}
        };
      }

      function render(playerData, benchmarkData, heroDetails) {
        const player = normalizePlayerData(playerData);
        const benchmark = normalizeBenchmarkData(benchmarkData);
        const score = clamp(Math.round((benchmark.hcScore ?? 90) * (
          (player.gpm / benchmark.gpm) * 0.35 +
          (player.xpm / benchmark.xpm) * 0.20 +
          (player.lh10 / benchmark.lh10) * 0.20 +
          ((player.netWorth || 1) / (benchmark.netWorth || 1)) * 0.15 +
          (((player.kills + player.assists) / Math.max(1, player.deaths + 1)) / ((benchmark.kills + benchmark.assists) / Math.max(1, benchmark.deaths + 1))) * 0.10
        )), 0, 100);

        const scoreHue = score >= 80 ? 'var(--green)' : score >= 65 ? 'var(--amber)' : 'var(--red)';
        const conic = `conic-gradient(${scoreHue} ${score * 3.6}deg, rgba(255,255,255,0.08) 0deg)`;

        const playerKda = (player.kills + player.assists) / Math.max(1, player.deaths);
        const benchmarkKda = (benchmark.kills + benchmark.assists) / Math.max(1, benchmark.deaths);
        const stats = [
          buildStatDelta(player.gpm, benchmark.gpm, 'GPM', 0),
          buildStatDelta(player.xpm, benchmark.xpm, 'XPM', 0),
          buildStatDelta(player.lh10, benchmark.lh10, 'LH@10', 0),
          buildStatDelta(player.netWorth, benchmark.netWorth, 'Net Worth', 0),
          buildStatDelta(playerKda, benchmarkKda, 'KDA', 2),
        ];

        const abilitySequence = normalizeAbilitySequence(player.abilityUpgrades);
        const talentChoices = normalizeTalentChoices(player.talentChoices);
        const neutralItems = normalizeNeutralItems(player.neutralItems);
        const itemTimings = normalizeItemTimings(player.itemTimings);
        const resolvedHero = resolveHeroSlug(player, heroDetails);

        root.innerHTML = `
          <section class="hc-panel-header">
            <div class="hc-title">
              <img class="hc-hero-portrait" src="${heroPortrait(resolvedHero)}" alt="${heroDetails.displayName}" />
              <div class="hc-title-text">
                <div class="hc-kicker">Hard Carry Benchmark</div>
                <h1 class="hc-hero-name">${heroDetails.displayName}</h1>
                <p class="hc-sub">Compare farm, build, timings, and decision quality against an optimal Position 1 reference.</p>
              </div>
            </div>

            <div class="hc-score" style="background:${conic}">
              <div class="hc-score-inner">
                <div>
                  <div class="hc-score-value">${score}</div>
                  <div class="hc-score-label">HC Efficiency</div>
                </div>
              </div>
            </div>
          </section>

          <section class="hc-body">
            <div class="hc-card">
              <div class="hc-card-header">
                <div>
                  <p class="hc-card-title">Core Farming Stats</p>
                  <p class="hc-card-subtitle">Player vs benchmark comparison</p>
                </div>
              </div>
              <div class="hc-section">
                <div class="hc-grid hc-stats">
                  ${stats.map((stat) => `
                    <div class="hc-stat">
                      <div class="hc-stat-top">
                        <div class="hc-stat-label">${stat.label}</div>
                        <div class="hc-stat-badge ${stat.trend === 'up' ? 'hc-up' : stat.trend === 'down' ? 'hc-down' : 'hc-mid'}">
                          ${stat.trend === 'up' ? '▲' : stat.trend === 'down' ? '▼' : '•'}
                          ${stat.diff >= 0 ? '+' : ''}${Number(stat.diff).toFixed(stat.decimals)}
                        </div>
                      </div>
                      <p class="hc-stat-value">${stat.label === 'Net Worth' ? formatNumber(stat.value) : Number(stat.value).toFixed(stat.decimals)}</p>
                      <div class="hc-stat-delta">Benchmark: ${stat.label === 'Net Worth' ? formatNumber(stat.optimal) : Number(stat.optimal).toFixed(stat.decimals)}</div>
                    </div>
                  `).join('')}
                </div>
              </div>
              <div class="hc-section hc-mini-chart">
                <canvas id="hc-item-radar"></canvas>
              </div>
            </div>

            <div class="hc-grid">
              <div class="hc-card">
                <div class="hc-card-header">
                  <div>
                    <p class="hc-card-title">Skill Build Progression</p>
                    <p class="hc-card-subtitle">Ability order from level-ups</p>
                  </div>
                </div>
                <div class="hc-section">
                  <div class="hc-ability-seq">
                    ${skillSeqMarkup(abilitySequence)}
                  </div>
                </div>
              </div>

              <div class="hc-card">
                <div class="hc-card-header">
                  <div>
                    <p class="hc-card-title">Talent Tree Choices</p>
                    <p class="hc-card-subtitle">Your pick vs benchmark pick</p>
                  </div>
                </div>
                <div class="hc-section">
                  <div class="hc-talent-grid">
                    ${talentMarkup({ talentChoices }, { talentChoices: benchmark.talentChoices })}
                  </div>
                </div>
              </div>
            </div>
          </section>

          <section class="hc-body" style="padding-top:0">
            <div class="hc-card hc-full">
              <div class="hc-card-header">
                <div>
                  <p class="hc-card-title">Neutral Items</p>
                  <p class="hc-card-subtitle">Tier timing and item selection</p>
                </div>
              </div>
              <div class="hc-section">
                <div class="hc-neutral-grid">
                  ${neutralMarkup({ neutralItems }, { neutralItems: benchmark.neutralItems })}
                </div>
              </div>
            </div>
          </section>

          <section class="hc-body" style="padding-top:0">
            <div class="hc-card hc-full">
              <div class="hc-card-header">
                <div>
                  <p class="hc-card-title">Key Item Timings</p>
                  <p class="hc-card-subtitle">Player purchase time vs optimal benchmark</p>
                </div>
              </div>
              <div class="hc-section">
                <div class="hc-item-grid">
                  ${itemTimingMarkup({ itemTimings }, { itemTimings: benchmark.itemTimings })}
                </div>
              </div>
            </div>
          </section>
        `;

        const radarCtx = document.getElementById('hc-item-radar');
        if (chart) chart.destroy();
        if (radarCtx && window.Chart) {
          chart = new Chart(radarCtx, {
            type: 'radar',
            data: {
              labels: ['GPM', 'XPM', 'LH@10', 'Net Worth', 'KDA'],
              datasets: [
                {
                  label: 'Player',
                  data: [
                    (player.gpm / benchmark.gpm) * 100,
                    (player.xpm / benchmark.xpm) * 100,
                    (player.lh10 / benchmark.lh10) * 100,
                    (player.netWorth / benchmark.netWorth) * 100,
                    (((player.kills + player.assists) / Math.max(1, player.deaths)) / ((benchmark.kills + benchmark.assists) / Math.max(1, benchmark.deaths))) * 100
                  ],
                  borderColor: 'rgba(57,208,255,0.95)',
                  backgroundColor: 'rgba(57,208,255,0.12)',
                  pointBackgroundColor: 'rgba(126, 241, 255, 1)',
                  pointBorderColor: '#0f0f12',
                  pointRadius: 3
                },
                {
                  label: 'Benchmark',
                  data: [100, 100, 100, 100, 100],
                  borderColor: 'rgba(255,255,255,0.22)',
                  backgroundColor: 'rgba(255,255,255,0.05)',
                  pointBackgroundColor: 'rgba(255,255,255,0.5)',
                  pointRadius: 2
                }
              ]
            },
            options: {
              responsive: true,
              maintainAspectRatio: false,
              plugins: {
                legend: {
                  labels: { color: '#d5ddf2', usePointStyle: true, boxWidth: 8 }
                },
                tooltip: {
                  callbacks: {
                    label: (ctx) => `${ctx.dataset.label}: ${Number(ctx.raw).toFixed(0)}`
                  }
                }
              },
              scales: {
                r: {
                  angleLines: { color: 'rgba(255,255,255,0.08)' },
                  grid: { color: 'rgba(255,255,255,0.08)' },
                  pointLabels: { color: '#bfc8db', font: { family: 'Inter' } },
                  ticks: {
                    color: '#8390a8',
                    backdropColor: 'transparent',
                    callback: (value) => `${value}%`
                  },
                  suggestedMin: 0,
                  suggestedMax: 140
                }
              }
            }
          });
        }
      }

      window.updateBenchmarkData = function updateBenchmarkData(playerData, benchmarkData, heroData = heroInfo) {
        const player = playerData || defaultPlayer;
        const benchmark = benchmarkData || defaultBenchmark;
        render(player, benchmark, heroData);
      };

      window.addEventListener('resize', () => {
        if (chart) chart.resize();
      });

      window.updateBenchmarkData(defaultPlayer, defaultBenchmark, heroInfo);
    })();
  </script>
</body>
</html>
