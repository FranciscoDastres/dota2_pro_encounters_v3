name: Build and deploy

on:
  push:
    branches:
      - main
  workflow_dispatch:

env:
  BACKEND_IMAGE: ghcr.io/franciscodastres/dota2-pro-encounters-backend
  WEB_IMAGE: ghcr.io/franciscodastres/dota2-pro-encounters-web
  DEPLOY_PATH: /opt/stomptracker

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR for publishing
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push backend image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: backend/Dockerfile
          push: true
          tags: |
            ${{ env.BACKEND_IMAGE }}:main
            ${{ env.BACKEND_IMAGE }}:${{ github.sha }}

      - name: Build and push web image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: frontend/Dockerfile
          push: true
          build-args: |
            VITE_API_URL=
          tags: |
            ${{ env.WEB_IMAGE }}:main
            ${{ env.WEB_IMAGE }}:${{ github.sha }}

      - name: Install SSH key
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_SSH_KEY: ${{ secrets.VPS_SSH_KEY }}
        run: |
          set -euo pipefail
          mkdir -p ~/.ssh
          printf '%s\n' "$VPS_SSH_KEY" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          ssh-keyscan -H "$VPS_HOST" >> ~/.ssh/known_hosts

      - name: Upload deployment files
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_USER: ${{ secrets.VPS_USER }}
        run: |
          set -euo pipefail
          ssh -i ~/.ssh/deploy_key "$VPS_USER@$VPS_HOST" "mkdir -p '$DEPLOY_PATH'/backups"
          scp -i ~/.ssh/deploy_key -r compose.prod.yml database scripts deploy/systemd "$VPS_USER@$VPS_HOST:$DEPLOY_PATH/"

      - name: Pull images and restart Compose services
        env:
          GHCR_READ_TOKEN: ${{ secrets.GHCR_READ_TOKEN }}
          GHCR_USERNAME: ${{ secrets.GHCR_USERNAME }}
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_USER: ${{ secrets.VPS_USER }}
        run: |
          set -euo pipefail
          remote_web_image="${WEB_IMAGE}:main"
          remote_backend_image="${BACKEND_IMAGE}:main"
          printf '%s' "$GHCR_READ_TOKEN" | ssh -i ~/.ssh/deploy_key "$VPS_USER@$VPS_HOST" "\
            set -e; \
            cd '$DEPLOY_PATH'; \
            test -f .env || (echo 'Missing /opt/stomptracker/.env' >&2; exit 1); \
            docker login ghcr.io -u '$GHCR_USERNAME' --password-stdin; \
            WEB_IMAGE='$remote_web_image' BACKEND_IMAGE='$remote_backend_image' docker compose -f compose.prod.yml pull; \
            WEB_IMAGE='$remote_web_image' BACKEND_IMAGE='$remote_backend_image' docker compose -f compose.prod.yml up -d --remove-orphans; \
            docker image prune -f \
          "
